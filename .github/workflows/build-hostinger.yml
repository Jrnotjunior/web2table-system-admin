name: Build System Admin for Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build for Hostinger root domain
        run: npm run build:hostinger
        env:
          VITE_SUPABASE_URL: https://wvibrchebfwirbgkcnbr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MILZBeZJeOw-bOeMo3Nukg_BKGWt_Qr

      - name: Copy company logo
        run: cp web2table.png dist/web2table.png

      - name: Verify Hostinger artifact paths
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          grep -q 'src="/assets/' dist/index.html
          # Validate the original approved System Admin stylesheet is emitted.
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.css' -print -quit)"
          echo "=== Built HTML entry points ==="
          grep -oE '(src|href)="[^"]+"' dist/index.html
          echo "=== Build files ==="
          find dist -maxdepth 2 -type f -print

      - name: Verify Web2Table custom-domain bundle
        run: |
          grep -Fq "import App from './App'" src/main.tsx
          grep -Rql --include='*.js' 'auth-login-card' dist/assets
          if grep -q '/web2table-system-admin/assets/' dist/index.html; then
            echo "Incorrect GitHub Pages asset base for custom domain"
            exit 1
          fi

      - name: Upload Hostinger build artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-admin-hostinger-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
