name: Build Hostinger package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
      - ".github/workflows/hostinger-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Hostinger site
        run: npm run build:hostinger
        env:
          VITE_WEB2TABLE_ADMIN: 'true'
          VITE_SUPABASE_URL: https://wvibrchebfwirbgkcnbr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_MILZBeZJeOw-bOeMo3Nukg_BKGWt_Qr

      - name: Verify deployment files
        run: |
          test -f dist/index.html
          test -d dist/assets
          test -f dist/.htaccess
          if grep -q '/web2table-system-admin/assets/' dist/index.html; then
            echo "GitHub Pages asset base leaked into Hostinger build."
            exit 1
          fi
          grep -Rql --include='*.js' 'Restaurant platform administration' dist/assets
          echo "Web2Table System Admin package verified."

      - name: Upload Hostinger package
        uses: actions/upload-artifact@v4
        with:
          name: web2table-system-admin-hostinger
          path: dist/
          if-no-files-found: error
          retention-days: 7
